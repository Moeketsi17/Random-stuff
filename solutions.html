let openIdx=-1,activeCat=0,activeOpenIdx=-1;
const arrowUrl="https://sde-group-co-uk.stylistichosting.co.uk/wp-content/uploads/2026/04/dotted-arrow-dark.svg";

const ciIconUrl=URL.createObjectURL(new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20.17 20.17"><style>.st0{fill:#081F2D;}</style><circle class="st0" cx="1.47" cy="10.12" r="1.47"/><circle class="st0" cx="5.78" cy="10.1" r="1.47"/><circle class="st0" cx="10.08" cy="10.08" r="1.47"/><circle class="st0" cx="14.39" cy="10.07" r="1.47"/><circle class="st0" cx="18.7" cy="10.05" r="1.47"/><circle class="st0" cx="10.12" cy="18.7" r="1.47"/><circle class="st0" cx="10.1" cy="14.39" r="1.47"/><circle class="st0" cx="10.07" cy="5.78" r="1.47"/><circle class="st0" cx="10.05" cy="1.47" r="1.47"/></svg>`],{type:'image/svg+xml'}));

function updateImg(icon,imgUrl){
  const pic=document.getElementById('imgpic');
  const ico=document.getElementById('imgico');
  if(imgUrl){pic.style.opacity='0';ico.style.opacity='0';setTimeout(()=>{pic.src=imgUrl;pic.style.opacity='1';},200);}
  else{pic.style.opacity='0';ico.className='ti '+icon;ico.style.opacity='1';}
}
function revertImg(){updateImg(data[activeCat].icon,data[activeCat].img||null);}
function hoverSel(idx){openIdx=-1;build(idx);updateImg(data[idx].icon,data[idx].img||null);}
function hoverRevert(){openIdx=activeOpenIdx;build(activeCat);revertImg();}

function build(idx){
  const col=document.getElementById('acc');
  col.innerHTML='';
  const cat=data[idx];
  const allA=document.createElement('a');
  allA.className='all-link';
  allA.href=cat.url;
  allA.innerHTML=`<span>All ${cat.label}</span><img class="all-link-arrow" src="${arrowUrl}" alt="">`;
  col.appendChild(allA);
  if(cat.type==='direct'){
    cat.links.forEach((lnk,i)=>{
      const a=document.createElement('a');const isObj=typeof lnk==='object';a.href=isObj&&lnk.url?lnk.url:'#';a.className='direct-link';
      a.innerHTML=`<span>${isObj?lnk.label:lnk}</span><img class="direct-link-arrow" src="${arrowUrl}" alt="">`;
      col.appendChild(a);
    });return;
  }
  cat.sections.forEach((sec,i)=>{
    const wrap=document.createElement('div');wrap.className='acc-wrap';
    wrap.onmouseenter=()=>updateImg(data[idx].icon,sec.img||null);
    wrap.onmouseleave=revertImg;
    const btn=document.createElement('button');btn.className='acc-trigger'+(i===openIdx?' open':'');
    btn.innerHTML=`<span>${sec.title}</span><img class="ci" src="${ciIconUrl}" aria-hidden="true">`;
    btn.onclick=()=>tog(i);
    const body=document.createElement('div');body.className='acc-body'+(i===openIdx?' open':'');
    const ul=document.createElement('ul');
    if(sec.url){
      const allLi=document.createElement('li');
      const allA=document.createElement('a');allA.href=sec.url;allA.className='acc-all-item';allA.textContent=`All ${sec.title}`;
      allLi.appendChild(allA);ul.appendChild(allLi);
    }
    sec.items.forEach(it=>{const li=document.createElement('li');const a=document.createElement('a');const isObj=typeof it==='object';a.href=isObj&&it.url?it.url:'#';a.textContent=isObj?it.label:it;li.appendChild(a);ul.appendChild(li);});
    body.appendChild(ul);wrap.appendChild(btn);wrap.appendChild(body);col.appendChild(wrap);
  });
}

function tog(i){
  openIdx=openIdx===i?-1:i;activeOpenIdx=openIdx;
  document.querySelectorAll('.acc-trigger').forEach((b,j)=>b.classList.toggle('open',j===openIdx));
  document.querySelectorAll('.acc-body').forEach((b,j)=>b.classList.toggle('open',j===openIdx));
}

function sel(btn,idx){
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');activeCat=idx;openIdx=-1;activeOpenIdx=-1;
  build(idx);
  const f=document.getElementById('imgf');f.classList.remove('fade');void f.offsetWidth;f.classList.add('fade');
  updateImg(data[idx].icon,data[idx].img||null);
}

build(0);updateImg(data[0].icon,data[0].img||null);

/* ---- Mobile nav ---- */
const mobNav=document.getElementById('mobileNav');
const mobOpenState={cat:-1,sub:-1};

function buildMobile(){
  mobNav.innerHTML='';
  data.forEach((cat,ci)=>{
    const wrap=document.createElement('div');wrap.className='mob-cat';
    const btn=document.createElement('button');btn.className='mob-cat-btn'+(mobOpenState.cat===ci?' open':'');
    const label=document.createElement('span');
    label.textContent=cat.label;
    const icon=document.createElement('img');
    icon.className='mob-cat-icon';
    icon.src=ciIconUrl;
    icon.setAttribute('aria-hidden','true');
    btn.appendChild(label);
    btn.appendChild(icon);
    btn.onclick=()=>mobTogCat(ci);
    const body=document.createElement('div');body.className='mob-cat-body'+(mobOpenState.cat===ci?' open':'');
    const mobAllA=document.createElement('a');
    mobAllA.className='mob-all-link';
    mobAllA.href=cat.url;
    mobAllA.innerHTML=`<span>All ${cat.label}</span><img class="mob-all-link-arrow" src="${arrowUrl}" alt="">`;
    body.appendChild(mobAllA);
    if(cat.type==='direct'){
      const linksWrap=document.createElement('div');linksWrap.className='mob-direct-links-wrap';
      cat.links.forEach(lnk=>{const a=document.createElement('a');const isObj=typeof lnk==='object';a.href=isObj&&lnk.url?lnk.url:'#';a.className='mob-direct-link';a.innerHTML=`<span>${isObj?lnk.label:lnk}</span><img class="mob-direct-link-arrow" src="${arrowUrl}" alt="">`;linksWrap.appendChild(a);});
      body.appendChild(linksWrap);
    } else {
      cat.sections.forEach((sec,si)=>{
        const sw=document.createElement('div');sw.className='mob-acc-wrap';
        const sb=document.createElement('button');sb.className='mob-acc-trigger'+(mobOpenState.cat===ci&&mobOpenState.sub===si?' open':'');
        sb.innerHTML=`<span>${sec.title}</span><img class="mob-ci" src="${ciIconUrl}" aria-hidden="true">`;
        sb.onclick=()=>mobTogSub(ci,si);
        const sbody=document.createElement('div');sbody.className='mob-acc-body'+(mobOpenState.cat===ci&&mobOpenState.sub===si?' open':'');
        const ul=document.createElement('ul');
        if(sec.url){
          const allLi=document.createElement('li');
          const allA=document.createElement('a');allA.href=sec.url;allA.className='mob-acc-all-item';allA.textContent=`All ${sec.title}`;
          allLi.appendChild(allA);ul.appendChild(allLi);
        }
        sec.items.forEach(it=>{const li=document.createElement('li');const a=document.createElement('a');const isObj=typeof it==='object';a.href=isObj&&it.url?it.url:'#';a.textContent=isObj?it.label:it;li.appendChild(a);ul.appendChild(li);});
        sbody.appendChild(ul);sw.appendChild(sb);sw.appendChild(sbody);body.appendChild(sw);
      });
    }
    wrap.appendChild(btn);wrap.appendChild(body);mobNav.appendChild(wrap);
  });
}

function mobTogCat(ci){
  mobOpenState.cat=mobOpenState.cat===ci?-1:ci;
  mobOpenState.sub=-1;
  buildMobile();
}
function mobTogSub(ci,si){
  if(mobOpenState.cat===ci&&mobOpenState.sub===si){mobOpenState.sub=-1;}
  else{mobOpenState.cat=ci;mobOpenState.sub=si;}
  buildMobile();
}

buildMobile();
</script>
